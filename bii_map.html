<!doctype html>
<meta charset="utf-8" />
<title>BII COG explorer</title>
<link href="https://esm.sh/maplibre-gl@5/dist/maplibre-gl.css" rel="stylesheet" />
<style>
  html, body, #map { margin: 0; height: 100%; }
  #panel {
    position: absolute; top: 10px; left: 10px; z-index: 1; padding: 10px;
    background: rgba(20,20,20,.85); color: #eee; font: 13px sans-serif; border-radius: 6px;
  }
  #panel select { margin-left: 6px; }
  #panel label { display: block; margin: 4px 0; }
  #timeline { display: flex; align-items: center; gap: 6px; margin: 6px 0; }
  #timeline input { flex: 1; }
  #play { width: 26px; cursor: pointer; }
  #yearlbl { width: 32px; text-align: right; font-variant-numeric: tabular-nums; }
  #legend { margin-top: 8px; }
  #legendbar { display: block; width: 200px; height: 12px; border-radius: 2px; }
  #legendticks { display: flex; justify-content: space-between; width: 200px; opacity: .8; margin-top: 2px; }
</style>
<div id="map"></div>
<div id="panel">
  <strong>Biodiversity Intactness</strong>
  <label>Source <select id="source">
    <option value="ours">BII v1.1</option>
    <option value="pc">Planetary Computer</option>
  </select></label>
  <div id="timeline">
    <button id="play">▶</button>
    <input id="year" type="range" />
    <span id="yearlbl"></span>
  </div>
  <div id="legend">
    <canvas id="legendbar"></canvas>
    <div id="legendticks"><span>0</span><span>0.5</span><span>1</span></div>
  </div>
</div>
<script type="module">
import maplibregl from "https://esm.sh/maplibre-gl@5";

const DEPS = "deps=@deck.gl/core@9.3.2,@deck.gl/layers@9.3.2,@deck.gl/geo-layers@9.3.2,@deck.gl/mesh-layers@9.3.2,@luma.gl/core@9.3.2,@luma.gl/engine@9.3.2,@luma.gl/shadertools@9.3.2";
const { MapboxOverlay } = await import(`https://esm.sh/@deck.gl/mapbox@9.3.2?${DEPS}`);
const { MosaicLayer, COGLayer } = await import(`https://esm.sh/@developmentseed/deck.gl-geotiff@0.8.0-beta.2?${DEPS}`);
const { CreateTexture, Colormap, MaskTexture, createColormapTexture, decodeColormapSprite } =
  await import(`https://esm.sh/@developmentseed/deck.gl-raster@0.8.0-beta.2/gpu-modules?${DEPS}`);
const { GeoTIFF, DecoderPool } = await import("https://esm.sh/@developmentseed/geotiff@0.8.0-beta.2");

// No createWorker -> decode on the main thread (cross-origin workers are blocked).
const pool = new DecoderPool();

const BUCKET = "https://vizz-bii.s3.amazonaws.com/out/v1_1";
const YEARS = [2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024];
const COLORMAP_PNG = "https://cdn.jsdelivr.net/npm/@developmentseed/deck.gl-raster@0.8.0-beta.2/dist/gpu-modules/colormaps.png";

// Planetary Computer io-biodiversity (Impact Observatory), the same render the PC explorer uses.
const PC = "https://planetarycomputer.microsoft.com/api/data/v1";
const PC_RENDER = "colormap_name=io-bii&expression=0.97*(data_b1**3.84)&rescale=0,1&collection=io-biodiversity&format=png";
const IOBII_PNG = `${PC}/legend/colormap/io-bii`;
// searchids are deterministic hashes of the per-year io-biodiversity mosaic search, registered
// once offline. Templating them keeps the page to plain image-tile GETs (a client-side register
// POST is a cross-origin fetch that the browser blocks; tile requests are not CORS-restricted).
const PC_SEARCH = {
  2017: "4f4c8ad5d551193def120f34a5675be8",
  2018: "3e61dee983f5ca5c0e3e3516a592939c",
  2019: "f4df7d41a0c2048d877e70488498aee9",
  2020: "4a12007f392843076344d27c952b1060",
};
const PC_YEARS = Object.keys(PC_SEARCH).map(Number);

let year = 2020;
let source = "ours";

// quadkey -> [minLon, minLat, maxLon, maxLat]
function quadkeyBbox(qk) {
  let x = 0, y = 0;
  const z = qk.length;
  for (let i = 0; i < z; i++) {
    const m = 1 << (z - i - 1), d = qk[i];
    if (d === "1") x |= m;
    else if (d === "2") y |= m;
    else if (d === "3") { x |= m; y |= m; }
  }
  const n = 2 ** z, lat = t => Math.atan(Math.sinh(Math.PI * (1 - 2 * t))) * 180 / Math.PI;
  return [x / n * 360 - 180, lat((y + 1) / n), (x + 1) / n * 360 - 180, lat(y / n)];
}

async function loadSources(yr) {
  const mj = await (await fetch(`${BUCKET}/bii_${yr}/bii_${yr}_mosaic.json`)).json();
  const bb = new Map();
  for (const [qk, cogs] of Object.entries(mj.tiles)) {
    const b = quadkeyBbox(qk);
    for (const c of cogs) {
      const url = c.replace("s3://vizz-bii/", "https://vizz-bii.s3.amazonaws.com/");
      const e = bb.get(url);
      if (e) { e[0] = Math.min(e[0], b[0]); e[1] = Math.min(e[1], b[1]); e[2] = Math.max(e[2], b[2]); e[3] = Math.max(e[3], b[3]); }
      else bb.set(url, [...b]);
    }
  }
  return [...bb].map(([url, bbox]) => ({ id: url, url, bbox }));
}

const tiffs = new Map();
function getTiff(url, opts) {
  let p = tiffs.get(url);
  if (!p) { p = GeoTIFF.fromUrl(url, opts).catch(e => { tiffs.delete(url); throw e; }); tiffs.set(url, p); }
  return p;
}

// Bake the PC render expression into a 256-entry colormap row so our COGs match the
// Planetary Computer tiles: colour(x) = io-bii(0.97 * x ** 3.84). Appended as the sprite's
// last layer (createColormapTexture requires a 256-wide sprite, one row per colormap).
function ioBiiRow(img) {
  const w = img.width, src = img.data, row = new Uint8ClampedArray(256 * 4);
  for (let i = 0; i < 256; i++) {
    const v = Math.min(1, 0.97 * (i / 255) ** 3.84);
    const c = Math.min(w - 1, Math.round(v * (w - 1)));
    row.set(src.subarray(c * 4, c * 4 + 4), i * 4);
  }
  return row;
}

let IOBII = 0;
let colormapTexture;
let legendRow;  // baked io-bii row (256 RGBA), value 0..1 -> displayed colour
const colormapImage = Promise.all([
  fetch(COLORMAP_PNG).then(r => r.arrayBuffer()).then(decodeColormapSprite),
  fetch(IOBII_PNG).then(r => r.arrayBuffer()).then(decodeColormapSprite),
]).then(([sprite, io]) => {
  IOBII = sprite.height;
  legendRow = ioBiiRow(io);
  const data = new Uint8ClampedArray(256 * 4 * (sprite.height + 1));
  data.set(sprite.data, 0);
  data.set(legendRow, 256 * 4 * sprite.height);
  return new ImageData(data, 256, sprite.height + 1);
});

// Decoded tile arrays are cached per image (the S3 COGs send no Cache-Control, so the
// browser refetches range requests) — switching years then only rebuilds GPU textures.
const tileArrays = new WeakMap();
async function getTileData(image, { device, x, y, signal, pool }) {
  let byTile = tileArrays.get(image);
  if (!byTile) tileArrays.set(image, byTile = new Map());
  const key = `${x},${y}`;
  let array = byTile.get(key);
  if (!array) byTile.set(key, array = (await image.fetchTile(x, y, { boundless: false, signal, pool })).array);
  const { width, height, data, mask } = array;
  const sampler = { minFilter: "nearest", magFilter: "nearest" };
  const texture = device.createTexture({ data, format: "r32float", width, height, sampler });
  const maskTexture = mask && device.createTexture({ data: mask, format: "r8unorm", width, height, sampler });
  if (!colormapTexture) colormapTexture = createColormapTexture(device, await colormapImage);
  return { texture, mask: maskTexture, width, height };
}

function renderTile(d) {
  const renderPipeline = [
    { module: CreateTexture, props: { textureName: d.texture } },
    { module: Colormap, props: { colormapTexture, colormapIndex: IOBII } },
  ];
  if (d.mask) renderPipeline.push({ module: MaskTexture, props: { maskTexture: d.mask } });
  return { renderPipeline };
}

function buildLayer(yr, sources) {
  return new MosaicLayer({
    id: `bii-${yr}`,
    sources,
    minZoom: 3,
    maxRequests: 12,
    getSource: (s, o) => getTiff(s.url, { signal: o.signal, concurrencyLimiter: o.concurrencyLimiter }),
    renderSource: (s, { data, signal }) =>
      new COGLayer({
        id: `cog-${yr}-${s.url}`,
        geotiff: data,
        pool,
        getTileData,
        renderTile,
        signal,
        onTileUnload: t => { t.content?.texture?.destroy(); t.content?.mask?.destroy(); },
      }),
  });
}

const map = new maplibregl.Map({
  container: "map",
  style: "https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json",
  center: [0, 20],
  zoom: 4,
});
const overlay = new MapboxOverlay({ interleaved: true, layers: [] });
map.addControl(overlay);

function pcTiles(yr) {
  return `${PC}/mosaic/${PC_SEARCH[yr]}/tiles/WebMercatorQuad/{z}/{x}/{y}@2x?${PC_RENDER}`;
}

// Only the active year is rendered; its GeoTIFF handles (in `tiffs`) and source list
// stay cached, so switching back rebuilds the GPU textures without refetching.
const sourcesByYear = new Map();
const pcYears = new Set();    // PC raster layers added, one per year
async function refresh() {
  if (source === "pc" && !pcYears.has(year)) {
    pcYears.add(year);
    map.addSource(`pc-${year}`, { type: "raster", tiles: [pcTiles(year)], tileSize: 512, minzoom: 2,
      attribution: "Biodiversity Intactness © Impact Observatory, via Microsoft Planetary Computer" });
    map.addLayer({ id: `pc-${year}`, type: "raster", source: `pc-${year}` });
  }
  for (const y of pcYears)
    map.setLayoutProperty(`pc-${y}`, "visibility", source === "pc" && y === year ? "visible" : "none");

  if (source === "ours" && !sourcesByYear.has(year))
    sourcesByYear.set(year, await loadSources(year));
  overlay.setProps({ layers: source === "ours" && sourcesByYear.has(year)
    ? [buildLayer(year, sourcesByYear.get(year))] : [] });
}

const sourceSel = document.getElementById("source");
const yearSel = document.getElementById("year");
const yearLbl = document.getElementById("yearlbl");
const playBtn = document.getElementById("play");

let years = YEARS;
function fillYears() {
  years = source === "pc" ? PC_YEARS : YEARS;
  if (!years.includes(year)) year = years[years.length - 1];
  yearSel.min = 0; yearSel.max = years.length - 1; yearSel.step = 1;
  yearSel.value = years.indexOf(year);
  yearLbl.textContent = year;
}

function setYear(i) {
  year = years[i];
  yearSel.value = i;
  yearLbl.textContent = year;
  refresh();
}

let timer = null;
playBtn.onclick = () => {
  if (timer) { clearInterval(timer); timer = null; playBtn.textContent = "▶"; return; }
  playBtn.textContent = "⏸";
  timer = setInterval(() => setYear((years.indexOf(year) + 1) % years.length), 1200);
};

sourceSel.onchange = e => { source = e.target.value; fillYears(); refresh(); };
yearSel.oninput = e => setYear(+e.target.value);

function drawLegend() {
  const cv = document.getElementById("legendbar");
  cv.width = 256; cv.height = 1;
  cv.getContext("2d").putImageData(new ImageData(new Uint8ClampedArray(legendRow), 256, 1), 0, 0);
}

map.on("load", async () => {
  await colormapImage;  // IOBII (io-bii layer index) is known once the sprite is combined
  drawLegend();
  fillYears();
  refresh();
});
</script>
