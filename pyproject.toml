[project]
name = "update-bii"
version = "0.1.0"
description = "Update Biodiversity Intactness Index data processing"
requires-python = ">=3.12"
dependencies = [
    "requests",
    "numpy",
    "rasterio",
    "geopandas",
    "pyogrio",
    "pyarrow",
    "shapely",
    "pystac-client",
    "boto3",
    "fsspec[s3]",
    "cog_worker",
    "edt",
    "opencv-python-headless",
]

[project.optional-dependencies]
# Notebooks, test suite, and host-side utility scripts (catalog generation).
dev = [
    "ipykernel",  # VSCode notebook kernel; avoids the full jupyter server/lab stack
    "matplotlib",
    "planetary-computer",  # signs Planetary Computer assets in the visualize notebooks
    "pytest",
    "rio-cogeo",  # cog_validate, used only by the test suite
    "cogeo-mosaic",  # catalog generation
    "stac-geoparquet",  # catalog generation
]

# Container worker entrypoints (the docker/Batch commands). The orchestrator CLIs live in scripts/.
[project.scripts]
bii-stage = "bii.stage:stage"
bii-index = "bii.stage:index"
bii-process = "bii.process:process"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bii"]
artifacts = ["src/bii/staging/data/*.geojson"]

[tool.pytest.ini_options]
markers = [
    "integration: tests that hit the network / real data sources (deselect with '-m \"not integration\"')",
]
